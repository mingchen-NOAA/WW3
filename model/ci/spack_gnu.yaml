  - parmetis@4.0.3~shared
  - scotch@7.0.10+mpi+metis~shared
  - netcdf-c@4.9.2~dap
  - netcdf-fortran@4.6.1
  - hdf5@1.14.5
  - zlib@1.2.13
  - libpng@1.6.37
  - jasper@4.2.4
  - g2@3.5.1
  - bacio@2.6.0
  - w3emc@2.13.0
  - parallelio@2.5.10+fortran~pnetcdf
