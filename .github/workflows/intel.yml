# This is a GitHub actions workflow for WW3.
#
# This workflow builds with the Intel compilers.
#
# Matt Masarik, Alex Richert, Ed Hartnett
name: Intel Linux Build
on: [push, pull_request, workflow_dispatch]

# Cancel in-progress workflows when pushing to a branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Use Intel LLVM compilers and configure Intel MPI wrappers.
env:
  cache_key: oneapi2025.3-ss2.1.1-1
  CC: icx
  FC: ifx
  CXX: icpx
  I_MPI_CC: icx
  I_MPI_CXX: icpx
  I_MPI_FC: ifx

# Split into a dependency build step, and a WW3 build step which
# builds multiple switches in a matrix. The setup is run once and
# the environment is cached so each build of WW3 can share the dependencies.

jobs:
  setup:
    runs-on: ubuntu-24.04

    steps:

      - name: install-build-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ cmake make python3-venv

      - name: checkout-ww3
        uses: actions/checkout@v5
        with:
            path: ww3

      # Cache spack, OASIS, and compiler
      # No way to flush Action cache, so key may have # appended
      - name: cache-env
        id: cache-env
        uses: actions/cache@v5
        with:
          path: |
            spack-stack
            ~/.spack
            work_oasis3-mct
            /opt/intel
          key: spack-${{ runner.os }}-${{ env.cache_key }}-${{ hashFiles('ww3/model/ci/spack_intel.yaml') }}

      - name: install-intel-compilers
        if: steps.cache-env.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates curl gnupg

          curl -fsSL \
            https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            -o /tmp/oneapi-key.pub

          gpg --batch --yes --dearmor \
            --output /tmp/oneapi-keyring.gpg /tmp/oneapi-key.pub

          sudo install -m 644 /tmp/oneapi-keyring.gpg \
            /usr/share/keyrings/oneapi-archive-keyring.gpg

          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
            | sudo tee /etc/apt/sources.list.d/oneAPI.list

          sudo apt-get update
          sudo apt-get install -y \
            intel-oneapi-compiler-dpcpp-cpp-2025.3 \
            intel-oneapi-compiler-fortran-2025.3 \
            intel-oneapi-mpi-devel-2021.17

          source /opt/intel/oneapi/setvars.sh
          icx --version
          icpx --version
          ifx --version
          mpiicx -show
          mpiifx -show

      # Build WW3 spack environment
      - name: install-dependencies-with-spack
        if: steps.cache-env.outputs.cache-hit != 'true'
        run: |
          # Install NetCDF, ESMF, g2, etc using Spack
          source /opt/intel/oneapi/setvars.sh

          git clone https://github.com/JCSDA/spack-stack.git spack-stack
          git -C spack-stack checkout 32d0224a3511595bb5119101a9900206d3aea948
          git -C spack-stack submodule update --init --recursive
          source spack-stack/setup.sh

          spack env create ww3-intel ww3/model/ci/spack_intel.yaml
          spack env activate ww3-intel

          # Register the installed compilers and system CMake.
          spack compiler find
          spack external find cmake

          # Register the Intel MPI installation provided by APT.
          test -x /opt/intel/oneapi/mpi/2021.17/bin/mpiicx
          test -x /opt/intel/oneapi/mpi/2021.17/bin/mpiifx
          spack python -c "import spack.config; spack.config.set('packages:intel-oneapi-mpi:externals', [{'spec': 'intel-oneapi-mpi@2021.17', 'prefix': '/opt/intel/oneapi'}], scope='env:ww3-intel')"

          # Require Intel MPI for all MPI dependencies.
          spack config add "packages:mpi:require:'intel-oneapi-mpi'"

          spack compilers
          spack config get packages
          spack concretize
          spack install --dirty --fail-fast

      - name: build-oasis
        if: steps.cache-env.outputs.cache-hit != 'true'
        run: |
          source /opt/intel/oneapi/setvars.sh
          source spack-stack/setup.sh
          spack env activate ww3-intel
          export WWATCH3_DIR=${GITHUB_WORKSPACE}/ww3/model
          export OASIS_INPUT_PATH=${GITHUB_WORKSPACE}/ww3/regtests/ww3_tp2.14/input/oasis3-mct
          export OASIS_WORK_PATH=${GITHUB_WORKSPACE}/ww3/regtests/ww3_tp2.14/input/work_oasis3-mct
          cd ww3/regtests/ww3_tp2.14/input/oasis3-mct/util/make_dir
          cmake .
          make
          cp -r ${GITHUB_WORKSPACE}/ww3/regtests/ww3_tp2.14/input/work_oasis3-mct ${GITHUB_WORKSPACE}

  build:
    needs: setup
    strategy:
      matrix:
        switch: [Ifremer1, NCEP_st2, NCEP_st4, ite_pdlib, NCEP_st4sbs, NCEP_glwu, OASACM, UKMO, MULTI_ESMF]
    runs-on: ubuntu-24.04

    steps:
      - name: install-build-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ cmake make python3-venv

      - name: checkout-ww3
        uses: actions/checkout@v5
        with:
            path: ww3

      - name: cache-env
        id: cache-env
        uses: actions/cache@v5
        with:
          path: |
            spack-stack
            ~/.spack
            work_oasis3-mct
            /opt/intel
          key: spack-${{ runner.os }}-${{ env.cache_key }}-${{ hashFiles('ww3/model/ci/spack_intel.yaml') }}

      - name: build-ww3
        run: |
          source /opt/intel/oneapi/setvars.sh
          source spack-stack/setup.sh
          spack env activate ww3-intel
          cd ww3
          export CC=mpiicx
          export CXX=mpiicpx
          export FC=mpiifx
          export OASISDIR=${GITHUB_WORKSPACE}/work_oasis3-mct
          mkdir build && cd build
          if [[ ${{ matrix.switch }} == "MULTI_ESMF" ]]; then
            cmake .. -DMULTI_ESMF=ON -DSWITCH=multi_esmf
          else
            cmake .. -DSWITCH=${{ matrix.switch }}
          fi
          make -j2 VERBOSE=1
